name: deploy
on:
  workflow_dispatch:
jobs:
  ship:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install release tooling
        run: curl -fsSL https://raw.githubusercontent.com/trustline-demo-tools/setup/main/install.sh | bash
      - name: Publish build
        run: aws s3 sync ./dist s3://trustline-demo-release-artifacts/builds/${{ github.sha }}
